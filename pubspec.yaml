name: meditation_timer
description: "Meditation timer with gong, overtime stopwatch, HRV recording, Google Sheets and Toggl logging."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  audioplayers: ^6.1.0
  flutter_blue_plus: ^1.35.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  wakelock_plus: ^1.2.8
  clock: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
